name: Deploy Graveyard Shift to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp LICENSE dist/LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Publish the production files to gh-pages
        run: |
          test -s "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"
          rsync -a --delete --exclude='/.git' --exclude='/CNAME' "$RUNNER_TEMP/site/" ./
          git add --all
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Publish Graveyard Shift from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
